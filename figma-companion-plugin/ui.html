<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #1e1e1e; color: #ffffff; padding: 16px; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .icon { width: 28px; height: 28px; background: #00a2ff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; }
    h2 { font-size: 14px; font-weight: 600; color: #fff; }
    p { font-size: 11px; color: #888; margin-top: 2px; }
    .status-box { background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 6px; padding: 10px; font-size: 12px; color: #ccc; min-height: 52px; display: flex; align-items: center; word-break: break-word; }
    .btn { background: #00a2ff; color: white; border: none; border-radius: 6px; padding: 10px 14px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s; }
    .btn:hover { background: #33b4ff; }
    .btn:active { transform: scale(0.98); }
    .success-badge { color: #2ecc71; font-weight: 600; }
    .error-badge { color: #e74c3c; font-weight: 600; }
  </style>
</head>
<body>
  <div>
    <div class="header">
      <div class="icon">⚡</div>
      <div>
        <h2>Figma to Roblox Exporter</h2>
        <p>1-Click JSON export for Studio Plugin</p>
      </div>
    </div>
    <div id="status" class="status-box">
      Select a Frame, Group, or Component in Figma and click below.
    </div>
  </div>

  <button id="exportBtn" class="btn">
    📋 Copy JSON for Roblox
  </button>

  <script>
    const exportBtn = document.getElementById('exportBtn');
    const statusDiv = document.getElementById('status');

    exportBtn.onclick = () => {
      statusDiv.innerHTML = '<span style="color:#00a2ff;">Exporting node hierarchy...</span>';
      parent.postMessage({ pluginMessage: { type: 'export-selected' } }, '*');
    };

    window.onmessage = async (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'success') {
        try {
          // Copy to clipboard
          const tempTextArea = document.createElement('textarea');
          tempTextArea.value = msg.json;
          document.body.appendChild(tempTextArea);
          tempTextArea.select();
          document.execCommand('copy');
          document.body.removeChild(tempTextArea);

          statusDiv.innerHTML = `<span class="success-badge">✓ Copied '${msg.nodeName}' to clipboard!</span><br><span style="font-size:10px;color:#aaa;">Now switch to Roblox Studio & click 'Generate UI'.</span>`;
        } catch (err) {
          statusDiv.innerHTML = `<span class="error-badge">Failed to copy to clipboard automatically.</span>`;
        }
      } else if (msg.type === 'error') {
        statusDiv.innerHTML = `<span class="error-badge">⚠ ${msg.message}</span>`;
      }
    };
  </script>
</body>
</html>
